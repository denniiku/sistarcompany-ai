name: Deploy to Firebase Hosting
on:
  push:
    branches: [ main ]
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Node.js 실행 환경 구성
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 2. 의존성 패키지 설치
      - name: Install Dependencies
        run: npm ci

      # 3. React 빌드 실행 (루트 바로 아래에 qubit-erp 폴더를 정적 생성)
      - name: Build Application
        run: npm run build
        env:
          NODE_ENV: production

      # 4. 기존처럼 루트(.) 폴더 전체를 안전하게 배포
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          channelId: live
          projectId: sistarcompany-ai
