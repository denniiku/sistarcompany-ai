    // --- Google Favicon & Domain Link Parser ---
    const parseDomainLinks = (urlsInput) => {
      if (!urlsInput) return [];
      const list = typeof urlsInput === 'string'
        ? urlsInput.split(',').map(u => u.trim()).filter(Boolean)
        : Array.isArray(urlsInput) ? urlsInput : [];

      return list.map((url, index) => {
        let domain = `Link ${index + 1}`;
        let cleanHost = 'google.com';
        try {
          const formattedUrl = url.startsWith('http://') || url.startsWith('https://') ? url : `https://${url}`;
          const parsed = new URL(formattedUrl);
          cleanHost = parsed.hostname.replace('www.', '');
          const parts = cleanHost.split('.');
          domain = parts.length >= 2 ? parts[0] : cleanHost;
        } catch (e) {
          domain = `Link ${index + 1}`;
          cleanHost = 'google.com';
        }
        const href = url.startsWith('http://') || url.startsWith('https://') ? url : `https://${url}`;
        const faviconUrl = `https://www.google.com/s2/favicons?domain=${cleanHost}&sz=32`;
        return { domain, href, faviconUrl, original: url, cleanHost };
      });
    };

    // --- Domain Grouping for My Platforms (Groups platforms by base domain & deduplicates favicons) ---
    const groupPlatformsByDomain = (platformsList) => {
      if (!platformsList || !Array.isArray(platformsList)) return [];
      const domainGroupsMap = new Map();

      platformsList.forEach(platform => {
        const links = parseDomainLinks(platform.urls);
        if (!links || links.length === 0) {
          const fallbackHost = 'other';
          if (!domainGroupsMap.has(fallbackHost)) {
            domainGroupsMap.set(fallbackHost, {
              domainHost: 'other',
              faviconUrl: 'https://www.google.com/s2/favicons?domain=google.com&sz=32',
              items: []
            });
          }
          domainGroupsMap.get(fallbackHost).items.push({
            platformId: platform.id,
            title: platform.title || 'Untitled Platform',
            category: platform.category,
            href: '#',
            domainLabel: platform.title || 'Untitled'
          });
        } else {
          links.forEach(link => {
            const hostParts = (link.cleanHost || 'google.com').split('.');
            const baseDomain = hostParts.length >= 2 ? hostParts.slice(-2).join('.') : (link.cleanHost || 'google.com');
            const faviconUrl = `https://www.google.com/s2/favicons?domain=${baseDomain}&sz=32`;

            if (!domainGroupsMap.has(baseDomain)) {
              domainGroupsMap.set(baseDomain, {
                domainHost: baseDomain,
                faviconUrl: faviconUrl,
                items: []
              });
            }

            const existingItems = domainGroupsMap.get(baseDomain).items;
            const isDuplicate = existingItems.some(
              it => it.platformId === platform.id && it.href === link.href
            );
            if (!isDuplicate) {
              existingItems.push({
                platformId: platform.id,
                title: platform.title || link.domain,
                category: platform.category,
                href: link.href,
                domainLabel: link.domain
              });
            }
          });
        }
      });

      return Array.from(domainGroupsMap.values());
    };

            await db.collection('users').doc(user.uid).collection(type).doc(id).set(finalItem, { merge: true });
          } catch (e) {
            console.error('Error saving to Firestore:', e);
          }
        }
        setActiveModalItem(null);
      };

      // Delete Item Handler
      const deleteItem = async (type, id) => {
        // ALWAYS update local state and localStorage first for instant UI response (optimistic UI)
        const updaters = {
          projects: [setProjects, 'aiceo_v7_projects'],
          ideas: [setIdeas, 'aiceo_v7_ideas'],
          studies: [setStudies, 'aiceo_v7_studies'],
          mindsets: [setMindsets, 'aiceo_v7_mindsets'],
          platforms: [setPlatforms, 'aiceo_v7_platforms'],
        };

        if (updaters[type]) {
          const [setFn, key] = updaters[type];
          setFn(prev => {
            const next = prev.filter(i => i.id !== id);
            localStorage.setItem(key, JSON.stringify(next));
            return next;
          });
        }

        // If Firebase is initialized, also delete from Firestore in a safe try-catch
        if (user && firebase.apps.length) {
          try {
            const db = firebase.firestore();
            await db.collection('users').doc(user.uid).collection(type).doc(id).delete();
          } catch (e) {
            console.error('Error deleting from Firestore:', e);
          }
        }
        setActiveModalItem(null);
      };

      // Bulk Delete Selected Handler
      const handleBulkDelete = () => {
        if (selectedIds.size === 0) return;
        setIsBulkDeleteConfirmOpen(true);
      };

      const executeBulkDelete = async () => {
        for (const id of selectedIds) {
          let itemType = null;
          if (projects.some(p => p.id === id)) itemType = 'projects';
          else if (ideas.some(i => i.id === id)) itemType = 'ideas';
          else if (studies.some(s => s.id === id)) itemType = 'studies';
          else if (mindsets.some(m => m.id === id)) itemType = 'mindsets';
          else if (platforms.some(p => p.id === id)) itemType = 'platforms';

          if (itemType) {
            await deleteItem(itemType, id);
          } else {
            // Fallback
            const allTypes = ['projects', 'ideas', 'studies', 'mindsets', 'platforms'];
            for (const type of allTypes) {
              await deleteItem(type, id);
            }
          }
        }
        setSelectedIds(new Set());
      };

      // Save Platforms Bulk List
      const handleSavePlatforms = async (newList) => {
        setPlatforms(newList);
        localStorage.setItem('aiceo_v7_platforms', JSON.stringify(newList));

        if (user && firebase.apps.length) {
          const db = firebase.firestore();
          const batch = db.batch();
          const userRef = db.collection('users').doc(user.uid);
          
          newList.forEach(p => {
            const docRef = userRef.collection('platforms').doc(p.id || `plat_${Date.now()}`);
            batch.set(docRef, p, { merge: true });
          });
          await batch.commit();
        }
        setIsPlatformModalOpen(false);
      };

      // Save Biz Communities Bulk List
      const handleSaveBizCommunities = async (newList) => {
        setBizCommunities(newList);
        localStorage.setItem('aiceo_v7_biz_communities', JSON.stringify(newList));

        if (user && firebase.apps.length) {
          const db = firebase.firestore();
          const batch = db.batch();
          const userRef = db.collection('users').doc(user.uid);
          
          newList.forEach(c => {
            const docRef = userRef.collection('biz_communities').doc(c.id || `bizc_${Date.now()}`);
            batch.set(docRef, c, { merge: true });
          });
          await batch.commit();
        }
        setIsBizCommunityModalOpen(false);
      };

      // Category Updates
      const saveCategories = (type, list) => {
        if (type === 'Project') {
          setProjectCategories(list);
          localStorage.setItem('aiceo_v7_proj_cats', JSON.stringify(list));
        } else {
          setIdeaCategories(list);
          localStorage.setItem('aiceo_v7_idea_cats', JSON.stringify(list));
        }
        setIsCatModalOpen(false);
      };

      // Branding Updates
      const handleSaveBranding = (updated) => {
        setBranding(updated);
        localStorage.setItem('aiceo_v7_branding', JSON.stringify(updated));
        setIsBrandingModalOpen(false);
        setIsSloganModalOpen(false);
      };

      // Toggle Selection (Only toggles selection, does NOT open edit modal)
      const toggleSelect = (id) => {
        setSelectedIds(prev => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id);
          else next.add(id);
          return next;
        });
      };

      // CEO Actions Save & Reset Handlers
      const handleSaveCeoActions = (newActions) => {
        setCeoActions(newActions);
        localStorage.setItem('aiceo_v7_ceo_actions', JSON.stringify(newActions));
        if (user && firebase.apps.length) {
          const db = firebase.firestore();
          db.collection('users').doc(user.uid).collection('settings').doc('ceo_actions')
            .set({ actions: newActions })
            .catch(e => console.error('Error saving CEO actions to Firestore:', e));
        }
      };

      const handleResetCeoActions = () => {
        setIsResetCeoActionsConfirmOpen(true);
      };

      const executeResetCeoActions = () => {
        setCeoActions(DEFAULT_CEO_ACTIONS);
        localStorage.removeItem('aiceo_v7_ceo_actions');
        setIsCeoActionManagerOpen(false);
      };

      // 1. Dynamic CEO Action Execution Router (Gemini REST API & Local Actions)
      const handleExecuteAction = async (action) => {
        if (selectedIds.size === 0) return;

        if (action.type === 'export_md') {
          handleExportMarkdownModal();
          return;
        }
        if (action.type === 'bulk_status') {
          setIsBulkStatusModalOpen(true);
          return;
        }
        if (action.type === 'send_email') {
          handleSendEmail();
          return;
        }
        if (action.type === 'delete') {
          handleBulkDelete();
          return;
        }

        // AI Actions (Built-in or Custom AI Directives)
        const all = [...projects, ...ideas, ...studies, ...mindsets, ...platforms];
        const selectedList = all.filter(item => selectedIds.has(item.id));

        const modeTitle = action.title || "AI Executive Analysis";
        const systemRole = action.directive || "You are an AI Executive Assistant providing high-level CEO strategic analysis.";

        let itemsFormatted = selectedList.map((item, idx) => {
          return `${idx + 1}. [${item.category || 'Exec'}] ${item.title || item.details}
- Company/Details: ${item.company || item.details || 'N/A'}
- Progress/Status: ${item.progress !== undefined ? item.progress + '%' : item.status || 'N/A'}
- Targets/Objectives: ${item.objective || 'N/A'}
- AI Context Vector: ${item.aiPrompt || 'N/A'}`;
        }).join('\n\n');

        const fullPrompt = `[ACTION DIRECTIVE]: ${systemRole}\n\n[USER DIRECTIVE / INSTRUCTION]:\n${instructionPrompt || 'Provide strategic guidance and key takeaways.'}\n\n[SELECTED MEMORY ITEMS (${selectedList.length})]:\n${itemsFormatted}`;

        setAiModalData({
          isOpen: true,
          loading: true,
          title: modeTitle,
          prompt: fullPrompt,
          result: ''
        });

        const apiKeyToUse = localStorage.getItem('USER_GEMINI_API_KEY') 
          || localStorage.getItem('aiceo_gemini_key') 
          || (typeof process !== 'undefined' && process.env && process.env.GEMINI_API_KEY) 
          || '';

        if (apiKeyToUse) {
          try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKeyToUse}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: fullPrompt }] }]
              })
            });
            const data = await res.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (text) {
              setAiModalData(prev => ({ ...prev, loading: false, result: text }));
              return;
            }
          } catch (err) {
            console.error('Gemini REST API error:', err);
          }
        }

        // Fallback response generator if API key is not yet set
        setTimeout(() => {
          let fallbackResult = `## ${modeTitle}\n**Date**: ${new Date().toLocaleDateString()}\n**Selected Items Analyzed**: ${selectedList.length}\n\n`;
          if (systemRole) {
            fallbackResult += `### Action Directive:\n> "${systemRole}"\n\n`;
          }
          if (instructionPrompt) {
            fallbackResult += `### Executive Instruction:\n> "${instructionPrompt}"\n\n`;
          }
          fallbackResult += `### Executive Analysis Output:\n`;
          selectedList.forEach(item => {
            fallbackResult += `1. **${item.title || item.details}** (${item.category || 'HQ'})\n   - Progress: ${item.progress !== undefined ? item.progress + '%' : 'Active'}\n   - Alignment: Executing strategy per ${action.title} directive.\n`;
          });
          if (!apiKeyToUse) {
            fallbackResult += `\n\n---\n*💡 Tip: Enter your Gemini API Key in the box below to activate live real-time Gemini 2.0 Flash REST API calls.*`;
          }

          setAiModalData(prev => ({ ...prev, loading: false, result: fallbackResult }));
        }, 500);
      };

      // 2. Export Markdown Modal Handler
      const handleExportMarkdownModal = () => {
        if (selectedIds.size === 0) return;
        const all = [...projects, ...ideas, ...studies, ...mindsets, ...platforms];
        const selectedList = all.filter(item => selectedIds.has(item.id));

        let md = `# ${branding.title} - Selected Executive Memory Export\n`;
        md += `*Export Date: ${new Date().toLocaleDateString()} | Total Selected Items: ${selectedList.length}*\n\n`;
        if (instructionPrompt.trim()) {
          md += `## Executive Directive / Instruction\n> ${instructionPrompt.trim()}\n\n---\n\n`;
        }
        md += `## Selected Items Specifications\n\n`;
        selectedList.forEach((item, idx) => {
          md += `### ${idx + 1}. [${item.category || 'Exec'}] ${item.title || item.details}\n`;
          if (item.company) md += `- **Company**: ${item.company}\n`;
          if (item.status) md += `- **Status**: ${item.status} (${item.progress}%)\n`;
          if (item.stars) md += `- **Rating**: ${item.stars} Star(s)\n`;
          if (item.objective) md += `- **Targets / Objectives**:\n${item.objective}\n`;
          if (item.aiPrompt) md += `- **AI Prompts for Actions**:\n${item.aiPrompt}\n`;
          if (item.details && item.title) md += `- **Details**: ${item.details}\n`;
          if (item.urls) md += `- **URLs**: ${item.urls}\n`;
          md += `\n`;
        });

        setMarkdownExportData({ isOpen: true, content: md });
      };

      // 3. Apply Bulk Progress (%) Update
      const handleApplyBulkStatus = async (newProgress) => {
        if (selectedIds.size === 0) return;

        setProjects(prev => {
          const next = prev.map(p => selectedIds.has(p.id) ? { ...p, progress: newProgress, updatedAt: new Date().toISOString().split('T')[0] } : p);
          localStorage.setItem('aiceo_v7_projects', JSON.stringify(next));
          return next;
        });

        if (user && firebase.apps.length) {
          const db = firebase.firestore();
          const batch = db.batch();
          const userRef = db.collection('users').doc(user.uid);

          for (const id of selectedIds) {
            const proj = projects.find(p => p.id === id);
            if (proj) {
              const docRef = userRef.collection('projects').doc(id);
              batch.update(docRef, { progress: newProgress, updatedAt: new Date().toISOString().split('T')[0] });
            }
          }
          await batch.commit().catch(e => console.error('Bulk status update error:', e));
        }

        setIsBulkStatusModalOpen(false);
        alert(`Updated progress to ${newProgress}% for selected items.`);
      };

      // Send Email with Selected Items & Executive Instruction
      const handleSendEmail = () => {
        if (selectedIds.size === 0) return;
        const all = [...projects, ...ideas, ...studies, ...mindsets, ...platforms];
        const selectedList = all.filter(item => selectedIds.has(item.id));

        let body = `Executive Briefing - ${branding.title}\nDate: ${new Date().toLocaleDateString()}\n\n`;
        if (instructionPrompt.trim()) {
          body += `[Executive Directives / Instruction]:\n${instructionPrompt.trim()}\n----------------------------------------\n\n`;
        }

        body += `Selected Memory Items (${selectedList.length}):\n\n`;
        selectedList.forEach((item, index) => {
          body += `${index + 1}. ${item.title || item.details}\n`;
          if (item.company) body += `   Company: ${item.company}\n`;
          if (item.category) body += `   Category: ${item.category}\n`;
          if (item.status) body += `   Status: ${item.status} (${item.progress}%)\n`;
          if (item.objective) body += `   Objectives:\n${item.objective}\n`;
          if (item.aiPrompt) body += `   AI Context:\n${item.aiPrompt}\n`;
          if (item.urls) body += `   URLs: ${item.urls}\n`;
          body += `\n`;
        });

        window.location.href = `mailto:?subject=${encodeURIComponent(`[${branding.title}] Selected Executive Directives & Briefing`)}&body=${encodeURIComponent(body)}`;
      };

      // Export CSV
      const handleExportCSV = () => {
        let csv = "Type,Title,Category,Company/Details,Status/Progress,Objectives,AI Prompt Vector,URLs,Date\n";

        projects.forEach(p => {
          csv += `"Project","${(p.title||'').replace(/"/g, '""')}","${p.category||''}","${p.company||''}","${p.status} (${p.progress}%)","${(p.objective||'').replace(/"/g, '""')}","${(p.aiPrompt||'').replace(/"/g, '""')}","${p.urls||''}","${p.updatedAt||''}"\n`;
        });
        ideas.forEach(i => {
          csv += `"Idea","${(i.title||'').replace(/"/g, '""')}","${i.category||''}","${(i.details||'').replace(/"/g, '""')}","Stars: ${i.stars||0}","N/A","N/A","${i.urls||''}","${i.createdAt||''}"\n`;
        });
        studies.forEach(s => {
          csv += `"Study","${(s.title||'').replace(/"/g, '""')}","RnD","${(s.details||'').replace(/"/g, '""')}","N/A","N/A","N/A","${s.urls||''}","${s.createdAt||''}"\n`;
        });
        mindsets.forEach(m => {
          csv += `"Mindset","${(m.title||'').replace(/"/g, '""')}","Executive","${(m.details||'').replace(/"/g, '""')}","N/A","N/A","N/A","${m.urls||''}","${m.createdAt||''}"\n`;
        });
        platforms.forEach(pl => {
          csv += `"Platform","${(pl.title||'').replace(/"/g, '""')}","${pl.category||''}","N/A","N/A","N/A","N/A","${pl.urls||''}","${pl.createdAt||''}"\n`;
        });

        const encodedUri = encodeURI("data:text/csv;charset=utf-8," + csv);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `AI_CEO_Executive_Export_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // Copy for AI Context
      const handleCopyForAI = (item) => {
        let md = '';
        if (item) {
          md = `### [${item.category || 'Executive'}] ${item.title || item.details}\n`;
          if (item.company) md += `**Company**: ${item.company}\n`;
          if (item.objective) md += `**Targets**:\n${item.objective}\n`;
          if (item.aiPrompt) md += `**AI Prompts for Actions**:\n${item.aiPrompt}\n`;
          if (item.details) md += `**Details**: ${item.details}\n`;
          if (item.urls) md += `**URLs**: ${item.urls}\n`;
        } else if (selectedIds.size > 0) {
          const all = [...projects, ...ideas, ...studies, ...mindsets, ...platforms];
          const list = all.filter(i => selectedIds.has(i.id));
          md = `# ${branding.title} Executive Prompt & Selected Memory Context (${list.length})\nDate: ${new Date().toLocaleDateString()}\n\n`;
          if (instructionPrompt.trim()) {
            md += `## Executive Instruction / Directive:\n${instructionPrompt.trim()}\n\n---\n\n`;
          }
          md += `## Selected Items:\n`;
          list.forEach(i => {
            md += `- **[${i.category || 'Exec'}] ${i.title || i.details}** (${i.company || 'N/A'})\n  Objectives/Details:\n${i.objective || i.details || 'N/A'}\n  AI Context:\n${i.aiPrompt || 'N/A'}\n  URLs: ${i.urls || 'None'}\n\n`;
          });
        } else {
          md = `# ${branding.title} Executive Memory & Dashboard Context\n\n`;
          md += `## Projects (${projects.length})\n`;
          projects.forEach(p => {
            md += `- **[${p.category}] ${p.title}** (${p.company}) | Progress: ${p.progress}%\n  Objectives:\n${p.objective || 'N/A'}\n  Prompt:\n${p.aiPrompt || 'N/A'}\n  URLs: ${p.urls || 'None'}\n`;
          });
          md += `\n## Ideas (${ideas.length})\n`;
          ideas.forEach(i => {
            md += `- **[${i.category}] ${i.title}** | Stars: ${i.stars || 0}\n  Details: ${i.details || 'N/A'}\n`;
          });
        }

        navigator.clipboard.writeText(md);
        alert('Copied Markdown context to clipboard!');
      };

      // Sorting Generic Utility
      const sortItems = (items, sortKey) => {
        return [...items].sort((a, b) => {
          if (sortKey === 'Title') {
            return (a.title || a.details || '').localeCompare(b.title || b.details || '');
          }
          if (sortKey === 'Company') {
            return (a.company || '').localeCompare(b.company || '');
          }
          if (sortKey === 'Progress %') {
            return (b.progress || 0) - (a.progress || 0);
          }
          if (sortKey === 'Stars') {
            return (b.stars || 0) - (a.stars || 0);
          }
          if (sortKey === 'Start Date') {
            return new Date(b.startDate || '1970-01-01') - new Date(a.startDate || '1970-01-01');
          }
          // Default Date Sort
          return new Date(b.updatedAt || b.createdAt || 0) - new Date(a.updatedAt || a.createdAt || 0);
        });
      };

      // Filtered & Sorted Lists
      const processedProjects = useMemo(() => {
        const filtered = projects.filter(p => {
          const matchArchived = !p.archived;
          const matchCat = selectedProjCat === 'All' || p.category === selectedProjCat;
          const matchQuery = !globalSearch.trim() ||
            p.title.toLowerCase().includes(globalSearch.toLowerCase()) ||
            (p.company && p.company.toLowerCase().includes(globalSearch.toLowerCase())) ||
            (p.objective && p.objective.toLowerCase().includes(globalSearch.toLowerCase()));
          return matchArchived && matchCat && matchQuery;
        });
        return sortItems(filtered, sortProjectBy);
      }, [projects, selectedProjCat, globalSearch, sortProjectBy]);

      const processedIdeas = useMemo(() => {
        const filtered = ideas.filter(i => {
          const matchCat = selectedIdeaCat === 'All' || i.category === selectedIdeaCat;
          const matchQuery = !globalSearch.trim() ||
            i.title.toLowerCase().includes(globalSearch.toLowerCase()) ||
            (i.details && i.details.toLowerCase().includes(globalSearch.toLowerCase()));
          return matchCat && matchQuery;
        });
        return sortItems(filtered, sortIdeaBy);
      }, [ideas, selectedIdeaCat, globalSearch, sortIdeaBy]);

      const processedStudies = useMemo(() => {
        const filtered = studies.filter(s => {
          return !globalSearch.trim() ||
            s.title.toLowerCase().includes(globalSearch.toLowerCase()) ||
            (s.details && s.details.toLowerCase().includes(globalSearch.toLowerCase()));
        });
        return sortItems(filtered, sortStudyBy);
      }, [studies, globalSearch, sortStudyBy]);

      const processedMindsets = useMemo(() => {
        const filtered = mindsets.filter(m => {
          return !globalSearch.trim() ||
            m.title.toLowerCase().includes(globalSearch.toLowerCase()) ||
            (m.details && m.details.toLowerCase().includes(globalSearch.toLowerCase()));
        });
        return sortItems(filtered, sortMindsetBy);
      }, [mindsets, globalSearch, sortMindsetBy]);

      // Global Search Live Dropdown Results
      const searchResults = useMemo(() => {
        if (!globalSearch.trim()) return [];
        const q = globalSearch.toLowerCase();
        const res = [];

        projects.forEach(p => {
          if (p.title.toLowerCase().includes(q) || (p.company && p.company.toLowerCase().includes(q))) {
            res.push({ type: 'projects', item: p, boxName: 'Projects', boxId: 'box-projects', category: p.category });
          }
        });
        ideas.forEach(i => {
          if (i.title.toLowerCase().includes(q) || (i.details && i.details.toLowerCase().includes(q))) {
            res.push({ type: 'ideas', item: i, boxName: 'Ideas', boxId: 'box-ideas', category: i.category });
          }
        });
        studies.forEach(s => {
          if (s.title.toLowerCase().includes(q) || (s.details && s.details.toLowerCase().includes(q))) {
            res.push({ type: 'studies', item: s, boxName: 'Study', boxId: 'box-study', category: 'RnD' });
          }
        });
        mindsets.forEach(m => {
          if (m.title.toLowerCase().includes(q) || (m.details && m.details.toLowerCase().includes(q))) {
            res.push({ type: 'mindsets', item: m, boxName: 'Mindset', boxId: 'box-mindset', category: 'Exec' });
          }
        });
        return res;
      }, [globalSearch, projects, ideas, studies, mindsets]);

      const headerRef = useRef(null);
      const [headerHeight, setHeaderHeight] = useState(44);

      useEffect(() => {
        const updateHeight = () => {
          if (headerRef.current) {
            setHeaderHeight(headerRef.current.offsetHeight);
          }
        };
        updateHeight();
        window.addEventListener('resize', updateHeight);
        return () => window.removeEventListener('resize', updateHeight);
      }, []);

      const scrollToTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });
      const scrollToBox = (id) => {
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      };

      // Metrics Calculations
      const activeProjectsCount = projects.filter(p => !p.archived).length;
      const inProgressCount = projects.filter(p => p.status === 'In Progress' && !p.archived).length;
      const threeStarProjectsCount = projects.filter(p => p.stars === 3 && !p.archived).length;
      const threeStarIdeasCount = ideas.filter(i => i.stars === 3).length;

      return (
        <div className="min-h-screen bg-appbg text-textslate font-normal flex flex-col pb-20">

          {/* 1. FIXED/PINNED MAIN NAVIGATION BAR HEADER (Sticky top-0) */}
          <div ref={headerRef} className="sticky top-0 z-50 bg-appbg/95 backdrop-blur-md border-b border-gray-200 shadow-sm">
            <header className="max-w-6xl w-full mx-auto px-3 sm:px-4 py-1 sm:py-1.5 flex flex-wrap sm:flex-nowrap items-center justify-between gap-2 relative">
              
              {/* Logo / Branding Area */}
              <div className="flex items-center shrink-0">
                {branding.logoUrl && (
                  <img src={branding.logoUrl} alt="Logo" className="w-4 h-4 sm:w-5 sm:h-5 object-contain rounded shrink-0 mr-1.5 sm:mr-2" />
                )}

                {/* Main Title + Hover Edit ✏️ */}
                <div
                  onClick={() => setIsBrandingModalOpen(true)}
                  className="relative group flex items-center space-x-1 cursor-pointer select-none"
                  title="Click to Edit Title & Logo"
                >
                  <span className="font-bold text-sm sm:text-base text-darkslate hover:text-brandsky transition-colors">
                    {branding.title || 'CEO ActionNote'}
                  </span>
                  <span className="opacity-0 group-hover:opacity-100 transition-opacity text-xs text-slate-400">
                    ✏️
                  </span>
                </div>

                {/* Slogan + Hover Edit ✏️ (exactly 2 spaces away, formatted as "| Slogan") */}
                <div
                  onClick={() => setIsSloganModalOpen(true)}
                  className="relative group flex items-center space-x-0.5 cursor-pointer select-none ml-2"
                  title="Click to Edit Slogan"
                >
                  <span className="text-[10.5px] sm:text-[11.5px] text-grayholder font-normal hover:text-darkslate transition-colors whitespace-nowrap">
                    | {branding.slogan || 'Intelligence Workspace'}
                  </span>
                  <span className="opacity-0 group-hover:opacity-100 transition-opacity text-[10.5px] text-slate-400">
                    ✏️
                  </span>
                </div>

              className="rounded-sm object-contain"
              style={{ width: '12px', height: '12px' }}
              onError={(e) => {
                e.target.onerror = null;
                e.target.src = 'https://www.google.com/s2/favicons?domain=google.com&sz=32';
              }}
            />
            {items.length > 1 && <span className="text-[7.5px] text-grayholder">▾</span>}
          </div>

          {/* Hover & Auto-Dismiss Dropdown Menu */}
          {isHovered && (
            <div
              className="absolute left-1/2 -translate-x-1/2 top-full pt-1 z-[100] min-w-[200px] max-w-xs transition-opacity duration-150"
              onMouseEnter={() => setIsHovered(true)}
              onMouseLeave={() => setIsHovered(false)}
            >
              <div className="bg-white border border-gray-200 rounded-lg shadow-2xl py-1.5 text-xs overflow-hidden">
                {/* Header showing Domain Name & Count */}
                <div className="px-3 py-1 border-b border-gray-100 flex items-center justify-between gap-2 bg-slate-50/80">
                  <span className="text-[10.5px] font-bold text-darkslate truncate capitalize">
                    {domainHost}
                  </span>
                  <span className="text-[9.5px] font-bold text-brandsky bg-sky-50 px-1.5 py-0.5 rounded shrink-0">
                    {items.length} {items.length === 1 ? 'platform' : 'platforms'}
                  </span>
                </div>

                {/* List of Platform Links under this domain */}
                <div className="py-1 max-h-56 overflow-y-auto">
                  {items.map((item, idx) => (
                    <a
                      key={idx}
                      href={item.href}
                      target="_blank"
                      rel="noopener noreferrer"
                      onClick={() => setIsHovered(false)}
                      className="flex items-center justify-between gap-2 px-3 py-1.5 hover:bg-sky-50 text-[11px] text-slate-700 hover:text-brandsky transition-colors cursor-pointer border-b border-gray-50 last:border-none"
                    >
                      <div className="truncate flex-1">
                        <div className="font-bold text-darkslate text-[11.5px] truncate hover:text-brandsky">
                          {item.title}
                        </div>
                        {item.href && item.href !== '#' && (
                          <div className="text-[9.5px] text-grayholder truncate">
                            {item.href}
                          </div>
                        )}
                      </div>
                      {item.category && (
                        <span className="text-[9.5px] font-bold text-brandsky bg-sky-50 px-1.5 py-0.5 rounded shrink-0">
                          {item.category}
                        </span>
                      )}
                    </a>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- REUSABLE QUADRANT BOX COMPONENT ---
    // Displays ONLY actual created data rows (no empty placeholder rows)
    function QuadrantBox({ id, title, count, page, setPage, onAdd, headerControls, onClickBox, children }) {
      const pageSize = 20;
      const maxPages = Math.ceil(count / pageSize);
      const childArray = React.Children.toArray(children);

      const isModalBox = !onClickBox || (id && id.includes('modal'));

      const handleBoxClick = (e) => {
        const isRowItem = e.target.closest('.quadrant-row-item');
        const isInteractiveElement = e.target.closest('button, select, input, a, label');
        if (!isRowItem && !isInteractiveElement && onClickBox) {
          onClickBox();
        }
      };

      return (
        <section
          id={id}
          onClick={handleBoxClick}
          className={`border border-gray-200 rounded-xl p-4 bg-white shadow-sm flex flex-col justify-between space-y-2 ${
            isModalBox
              ? 'min-h-[300px]'
              : 'min-h-[300px] cursor-pointer hover:border-slate-300 hover:shadow-md transition-all'
          }`}
        >
          
          {/* Box Header */}
          <div className="flex items-center justify-between border-b border-gray-100 pb-2">
            <div className="flex items-center space-x-2">
              <span className="font-bold text-[13px] text-brandsky">{title}</span>
              <button
                onClick={(e) => { e.stopPropagation(); onAdd(); }}
                className="px-1.5 py-0.5 rounded bg-sky-50 text-brandsky hover:bg-sky-100 text-xs font-bold transition-colors cursor-pointer"
                title="Add New Item"
              >
                +
              </button>
              <span className="text-[10.5px] text-grayholder">({count})</span>
            </div>

            <div className="flex items-center space-x-2" onClick={(e) => e.stopPropagation()}>
              {headerControls}
            </div>
          </div>

          {/* Rows Container - Only actual created data, no empty dots/dashes */}
          <div 
            className={`divide-y divide-gray-50 flex-1 ${
              isModalBox 
                ? 'min-h-[220px]' 
                : 'min-h-[220px] max-h-[325px] overflow-y-auto pr-1'
            }`}
          >
            {childArray.length > 0 ? childArray : (
              <div className="py-12 text-center text-grayholder text-xs italic">
                No items in {title}. Click + to create a new item.
              </div>
            )}
          </div>

          {/* 20-Item Pagination Controls - ONLY active when count > 20 */}
          {count > 20 && (
            <div className="flex items-center justify-between pt-2 border-t border-gray-100 text-xs text-grayholder" onClick={(e) => e.stopPropagation()}>
              <span>Page {page + 1} of {maxPages}</span>
              <div className="space-x-2">
                <button
                  disabled={page === 0}
                  onClick={() => setPage(p => Math.max(0, p - 1))}
                  className="disabled:opacity-30 hover:text-darkslate cursor-pointer"
                >
                  [Prev]
                </button>
                <button
                  disabled={page >= maxPages - 1}
                  onClick={() => setPage(p => Math.min(maxPages - 1, p + 1))}
                  className="disabled:opacity-30 hover:text-darkslate cursor-pointer"
                >
                  [Next]
                </button>
              </div>
            </div>
          )}
        </section>
      );
    }

    // --- QUADRANT ROW ITEM COMPONENT ---
    // Structure: [Checkbox] Title | Company | Category | % | Stars
    // Checkbox click ONLY toggles selection and DOES NOT open edit modal.
    function QuadrantRowItem({
      id, title, company, category, progress, stars,
      isSelected, onToggleSelect, onClick
    }) {
      const hasSecondary = company || category || progress !== undefined || stars !== undefined;

      return (
        <div
          onClick={onClick}
          className="quadrant-row-item py-1.5 px-1 cursor-pointer hover:bg-slate-50 transition-colors border-b border-gray-50 last:border-none text-slate-600"
        >
          {/* Desktop Single-Line View (hidden on mobile) */}
          <div className="hidden sm:flex items-center justify-between gap-1 text-[11.5px] truncate">
            <div className="flex items-center space-x-1.5 truncate min-w-0 flex-1">
              <span
                onClick={(e) => { e.stopPropagation(); onToggleSelect(); }}
                className="p-3.5 -m-3.5 inline-flex items-center justify-center cursor-pointer shrink-0 select-none rounded hover:bg-sky-100/40 transition-colors"
                title="Select item"
              >
                <input
                  type="checkbox"
                  checked={isSelected}
                  onChange={(e) => { e.stopPropagation(); onToggleSelect(); }}
                  onClick={(e) => e.stopPropagation()}
                  className="transform scale-75 rounded border-gray-300 text-brandsky focus:ring-brandsky cursor-pointer shrink-0"
                />
              </span>
              <span className="text-darkslate font-bold text-[12px] truncate">{title}</span>
              {company && <span className="text-grayholder text-[10.5px] shrink-0">| {company}</span>}
              {category && <span className="text-grayholder text-[10.5px] shrink-0">| {category}</span>}
              {progress !== undefined && (
                <span className="text-brandsky text-[10.5px] font-medium shrink-0">
                  | {progress}%
                </span>
              )}
            </div>
            {stars !== undefined && (
              <span className="text-amber-400 shrink-0 text-[10.5px] pl-1 font-normal tracking-tighter">
                {stars === 3 ? '★★★' : stars === 2 ? '★★☆' : stars === 1 ? '★☆☆' : '☆☆☆'}
              </span>
            )}
          </div>

          {/* Mobile Two-Line View (flex on mobile, hidden on sm+) */}
          <div className="flex sm:hidden flex-col gap-0.5">
            {/* Line 1: Checkbox + Full Title */}
            <div className="flex items-start space-x-2">
              <span
                onClick={(e) => { e.stopPropagation(); onToggleSelect(); }}
                className="p-3.5 -m-3.5 inline-flex items-center justify-center cursor-pointer shrink-0 select-none rounded hover:bg-sky-100/40 transition-colors mt-0.5"
                title="Select item"
              >
                <input
                  type="checkbox"
                  checked={isSelected}
                  onChange={(e) => { e.stopPropagation(); onToggleSelect(); }}
                  onClick={(e) => e.stopPropagation()}
                  className="transform scale-90 rounded border-gray-300 text-brandsky focus:ring-brandsky cursor-pointer shrink-0"
                />
              </span>
              <span className="text-darkslate font-bold text-[12.5px] leading-snug flex-1 break-words">
                {title}
              </span>
            </div>

            {/* Line 2: Secondary indexes underneath */}
            {hasSecondary && (
              <div className="pl-6 flex items-center flex-wrap gap-x-2 gap-y-0.5 text-[10.5px] text-grayholder">
                {company && <span>{company}</span>}
                {company && category && <span>•</span>}
                {category && <span>{category}</span>}
                {progress !== undefined && (
                  <span className="text-brandsky font-medium">
                    ({progress}%)
                  </span>
                )}
                {stars !== undefined && (
                  <span className="text-amber-400 font-normal ml-auto">
                    {stars === 3 ? '★★★' : stars === 2 ? '★★☆' : stars === 1 ? '★☆☆' : '☆☆☆'}
                  </span>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- ITEM DETAIL MODAL (Compact Popup Size & Bold Labels, No 'Edit' Word) ---
    function ItemModal({ modalData, projectCategories, ideaCategories, onClose, onSave, onDelete, onCopyForAI }) {
      const { type, item, isNew } = modalData;
      const [showArchiveConfirm, setShowArchiveConfirm] = useState(false);
      const [isDeleteConfirming, setIsDeleteConfirming] = useState(false);
      const [form, setForm] = useState({
        ...item,
        objective: item.objective || (type === 'projects' ? OBJECTIVES_TEMPLATE : ''),
        aiPrompt: item.aiPrompt || (type === 'projects' ? AI_PROMPT_TEMPLATE : ''),
        stars: item.stars !== undefined ? item.stars : 1
      });
      const [pre100Progress, setPre100Progress] = useState(item.progress || 0);

      const handleChange = (field, val) => setForm(prev => ({ ...prev, [field]: val }));

      const handleStatusChange = (newStatus) => {
        if (newStatus === 'Completed') {
          setShowArchiveConfirm(true);
        } else {
          setForm(prev => ({
            ...prev,
            status: newStatus,
            progress: prev.progress === 100 ? (pre100Progress < 100 ? pre100Progress : 99) : prev.progress,
            archived: false
          }));
        }
      };

      const getModalTitle = (t) => {
        const nameMap = {
          projects: 'Projects',
          ideas: 'Idea/ Insight',
          studies: 'Study/ RnD',
          mindsets: 'Mindfulness'
        };
        const label = nameMap[t] || 'Item';
        return isNew ? `New ${label}` : label;
      };

      return (
        <div
          onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}
          className="fixed inset-0 z-[80] modal-backdrop flex items-center justify-center p-4 overflow-y-auto"
        >
          <div className="bg-white rounded-xl shadow-2xl max-w-sm w-full p-4 space-y-3 border border-gray-200 my-4">
            
            {/* Modal Top Header */}
            <div className="flex items-center justify-between border-b border-gray-100 pb-2">
              <span className="font-bold text-sm text-brandsky">
                {getModalTitle(type)}
              </span>

              <div className="flex items-center space-x-2">
                <button
                  type="button"
                  onClick={() => onCopyForAI(form)}
                  className="px-1.5 py-0.5 rounded bg-sky-50 text-brandsky hover:bg-sky-100 text-[10px] font-normal transition-colors cursor-pointer"
                >
                  Copy for AI Actions
                </button>
                <button onClick={onClose} className="text-slate-400 hover:text-darkslate text-sm font-bold pl-1 cursor-pointer">
                  ✕
                </button>
              </div>
            </div>

            {/* Modal Form Body */}
            <form onSubmit={(e) => { e.preventDefault(); onSave(type, form); }} className="space-y-2 text-[11.5px]">
              
              {/* Row 1: Title + Status (Projects only) or normal Title block */}
              {type === 'projects' ? (
                <div className="grid grid-cols-3 gap-2">
                  <div className="col-span-2">
                    <label className="block font-bold text-gray-800 text-[11px] mb-0.5">Title</label>
                    <input
                      type="text"
                      required
                      value={form.title || ''}
                      onChange={(e) => handleChange('title', e.target.value)}
                      placeholder="Enter title..."
                      className="w-full h-8 px-2.5 py-1 border border-gray-200 rounded text-[11px] text-darkslate focus:outline-none focus:border-brandsky"
                    />
                  </div>
                  <div>
                    <label className="block font-bold text-gray-800 text-[11px] mb-0.5">Status</label>
                    <select
                      disabled={!form.startDate}
                      value={form.status || 'In Progress'}
                      onChange={(e) => handleStatusChange(e.target.value)}
                      className={`w-full h-8 px-2 py-1 border rounded text-[11px] focus:outline-none ${
                        !form.startDate
                          ? 'border-gray-100 bg-gray-50 text-gray-400 cursor-not-allowed'
                          : 'border-gray-200 text-darkslate'
                      }`}
                    >
                      <option value="In Progress">In Progress</option>
                      <option value="Completed">Completed</option>
                      <option value="On Hold">On Hold</option>
                    </select>
                  </div>
                </div>
              ) : (
                /* Non-projects standard Title Row */
                <div>
                  <label className="block font-bold text-gray-800 text-[11.5px] mb-0.5">Title</label>
                  <input
                    type="text"
                    required
                    value={form.title || ''}
                    onChange={(e) => handleChange('title', e.target.value)}
                    placeholder="Enter title..."
                    className="w-full px-2.5 py-1 border border-gray-200 rounded text-[11.5px] text-darkslate focus:outline-none focus:border-brandsky"
                  />
                </div>
              )}

              {/* Projects Category & Company (Compact Row for Projects) */}
              {type === 'projects' && (
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block font-bold text-gray-800 text-[11px] mb-0.5">Category</label>
                    <select
                      value={form.category || projectCategories[0]}
                      onChange={(e) => handleChange('category', e.target.value)}
                      className="w-full px-2 py-1 border border-gray-200 rounded text-[11px] text-darkslate focus:outline-none"
                    >
                      {projectCategories.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block font-bold text-gray-800 text-[11px] mb-0.5">Company/ D'pt</label>
                    <input
                      type="text"
                      value={form.company || ''}
                      onChange={(e) => handleChange('company', e.target.value)}
                      placeholder="Company/ D'pt name..."
                      className="w-full px-2.5 py-1 border border-gray-200 rounded text-[11px] text-darkslate focus:outline-none"
                    />
                  </div>
                </div>
              )}

              {/* Row 2: [Start Project] Button + Start Date + Target End Date (Projects only) */}
              {type === 'projects' && (
                <div className="grid grid-cols-3 gap-2 items-end bg-sky-50/15 border border-sky-100 p-2 rounded-lg">
                  <div>
                    <label className="block font-bold text-gray-800 text-[10px] mb-0.5">Action</label>
                    <button
                      type="button"
                      onClick={() => {
                        if (!form.startDate) {
                          const today = new Date().toISOString().split('T')[0];
                          setForm(prev => ({
                            ...prev,
                            startDate: today,
                            status: 'In Progress',
                            progress: prev.progress || 0,
                            targetEndDate: prev.targetEndDate || today
                          }));
                        } else {
                          setForm(prev => ({
                            ...prev,
                            startDate: '',
                            targetEndDate: '',
                            progress: 0,
                            status: 'In Progress'
                          }));
                        }
                      }}
                      className={`w-full h-8 flex items-center justify-center rounded font-bold text-[10px] cursor-pointer transition-colors ${
                        form.startDate
                          ? 'bg-amber-100 hover:bg-amber-200 text-[#f97316]'
                          : 'bg-sky-500 hover:bg-sky-600 text-white'
                      }`}
                    >
                      {form.startDate ? '✕ Cancel' : '▶ Start'}
                    </button>
                  </div>
                  <div>
                    <label className="block font-bold text-gray-800 text-[10px] mb-0.5">Start Date</label>
                    <input
                      type="date"
                      disabled
                      value={form.startDate || ''}
                      className="w-full h-8 px-1.5 py-1 border border-gray-100 bg-gray-50 rounded text-[10px] text-gray-500 font-sans focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="block font-bold text-gray-800 text-[10px] mb-0.5">Target End Date</label>
                    <input
                      type="date"
                      disabled={!form.startDate}
                      value={form.targetEndDate || ''}
                      onChange={(e) => handleChange('targetEndDate', e.target.value)}
                      className={`w-full h-8 px-1.5 py-1 border rounded text-[10px] font-sans focus:outline-none ${
                        !form.startDate
                          ? 'border-gray-100 bg-gray-50 text-gray-400'
                          : 'border-gray-200 text-darkslate focus:border-brandsky'
                      }`}
                    />
                  </div>
                </div>
              )}

              {/* Ideas Category & Star Rating */}
              {type === 'ideas' && (
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block font-bold text-gray-800 text-[11.5px] mb-0.5">Category</label>
                    <select
                      value={form.category || ideaCategories[0]}
                      onChange={(e) => handleChange('category', e.target.value)}
                      className="w-full px-2 py-1 border border-gray-200 rounded text-[11.5px] text-darkslate focus:outline-none"
                    >
                      {ideaCategories.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block font-bold text-gray-800 text-[11.5px] mb-0.5">Stars</label>
                    <div className="flex items-center space-x-0.5 py-1">
                      {[1, 2, 3].map(num => (
                        <button
                          key={num}
                          type="button"
                          onClick={() => {
                            const newStars = form.stars === num && num === 1 ? 0 : num;
                            handleChange('stars', newStars);
                          }}
                          className="text-base text-amber-400 hover:text-amber-500 focus:outline-none cursor-pointer px-0.5"
                          title={`${num} Star`}
                        >
                          {num <= (form.stars || 0) ? '★' : '☆'}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* Row 3: 별표 평가 (☆☆☆) + Progress 슬라이더 (0~100%) (Projects only) */}
              {type === 'projects' && (
                <div className="grid grid-cols-3 gap-2 items-center">
                  <div>
                    <label className="block font-bold text-gray-800 text-[10.5px] mb-0.5">Stars</label>
                    <div className="flex items-center space-x-0.5">
                      {[1, 2, 3].map(num => (
                        <button
                          key={num}
                          type="button"
                          onClick={() => {
                            const newStars = form.stars === num && num === 1 ? 0 : num;
                            handleChange('stars', newStars);
                          }}
                          className="text-base text-amber-400 hover:text-amber-500 focus:outline-none cursor-pointer px-0.5"
                          title={`${num} Star`}
                        >
                          {num <= (form.stars || 0) ? '★' : '☆'}
                        </button>
                      ))}
                    </div>
                  </div>
                  <div className="col-span-2">
                    <div className="flex justify-between font-bold text-gray-800 text-[10.5px] mb-0.5">
                      <span>Progress</span>
                      <span className="text-brandsky font-medium">{form.progress || 0}%</span>
                    </div>
                    <input
                      type="range"
                      min="0"
                      max="100"
                      disabled={!form.startDate}
                      value={form.progress || 0}
                      onChange={(e) => {
                        const val = parseInt(e.target.value);
                        if (val === 100) {
                          setShowArchiveConfirm(true);
                        } else {
                          setForm(prev => ({
                            ...prev,
                            progress: val,
                            status: val < 100 && prev.status === 'Completed' ? 'In Progress' : prev.status,
                            archived: val < 100 ? false : prev.archived
                          }));
                          if (val < 100) {
                            setPre100Progress(val);
                          }
                        }
                      }}
                      className={`w-full cursor-pointer h-5 ${!form.startDate ? 'opacity-50 cursor-not-allowed' : ''}`}
                    />
                  </div>
                </div>
              )}

              {/* Completion & Archive Confirmation Overlay */}
              {showArchiveConfirm && (
                <div className="fixed inset-0 bg-black/60 z-[200] flex items-center justify-center p-4 backdrop-blur-xs">
                  <div className="bg-white rounded-xl shadow-2xl p-5 max-w-xs w-full border border-gray-100 text-center space-y-4">
                    <div className="text-3xl">📦</div>
                    <div className="font-bold text-darkslate text-sm">Project Completion</div>
                    <p className="text-[11.5px] text-slate-600 leading-normal">
                      완료된 프로젝트를 Archive 폴더로 옮기시겠습니까?
                    </p>
                    <div className="flex justify-center space-x-3 pt-1">
                      <button
                        type="button"
                        onClick={() => {
                          const updated = { ...form, progress: 100, status: 'Completed', archived: true };
                          setForm(updated);
                          setShowArchiveConfirm(false);
                          onSave('projects', updated);
                        }}
                        className="px-4 py-1.5 bg-brandsky hover:bg-sky-600 text-white rounded text-xs font-bold transition-colors cursor-pointer"
                      >
                        YES
                      </button>
                      <button
                        type="button"
                        onClick={() => {
                          const prevVal = pre100Progress < 100 ? pre100Progress : 99;
                          const updated = { ...form, progress: prevVal, status: 'In Progress', archived: false };
                          setForm(updated);
                          setShowArchiveConfirm(false);
                        }}
                        className="px-4 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded text-xs font-bold transition-colors cursor-pointer"
                      >
                        NO
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* Targets (formerly Objectives, written input text color is gray) */}
              {type === 'projects' && (
                <div>
                  <label className="block font-bold text-gray-800 text-[11.5px] mb-0.5">Targets</label>
                  <textarea
                    rows={4}
                    value={form.objective || ''}
                    onChange={(e) => handleChange('objective', e.target.value)}
                    placeholder={OBJECTIVES_TEMPLATE}
                    className="w-full px-2.5 py-1 border border-gray-200 rounded text-[11.5px] text-gray-500 font-sans focus:outline-none focus:border-brandsky leading-relaxed"
                  />
                </div>
              )}

              {/* AI Prompts for Actions */}
              {type === 'projects' && (
                <div>
                  <label className="block font-bold text-gray-800 text-[11.5px] mb-0.5">AI Prompts for Actions</label>
                  <textarea
                    rows={4}
                    value={form.aiPrompt || ''}
                    onChange={(e) => handleChange('aiPrompt', e.target.value)}
                    placeholder={AI_PROMPT_TEMPLATE}
                    className="w-full px-2.5 py-1 border border-gray-200 rounded text-[11.5px] text-gray-500 font-sans focus:outline-none focus:border-brandsky leading-relaxed"
                  />
                </div>
              )}

              {/* Details Field for Ideas, Study, Mindset */}
              {type !== 'projects' && (
                <div>
                  <label className="block font-bold text-gray-800 text-[11.5px] mb-0.5">Details</label>
                  <textarea
                    rows={4}
                    value={form.details || ''}

    // --- PROJECT EXECUTION CALENDAR MODAL COMPONENT ---
    function CalendarModal({ projects, onClose, onSaveProject, onEditProject }) {
      const [currentDate, setCurrentDate] = useState(() => {
        // Default to first scheduled active project date, or August 2026
        const firstProj = projects.find(p => p.startDate && !p.archived);
        if (firstProj) {
          const d = new Date(firstProj.startDate);
          return new Date(d.getFullYear(), d.getMonth(), 1);
        }
        return new Date(2026, 7, 1);
      });
      const [localProjects, setLocalProjects] = useState(projects);
      const [resizingProject, setResizingProject] = useState(null);
      const [selectedDateForPopup, setSelectedDateForPopup] = useState(null);

      // Keep local copy in sync with parent prop
      useEffect(() => {
        setLocalProjects(projects);
      }, [projects]);

      // Global MouseUp to complete resizing
      useEffect(() => {
        const handleMouseUp = () => {
          if (resizingProject) {
            const updated = localProjects.find(p => p.id === resizingProject.id);
            if (updated) {
              onSaveProject(updated);
            }
            setResizingProject(null);
          }
        };
        window.addEventListener('mouseup', handleMouseUp);
        return () => window.removeEventListener('mouseup', handleMouseUp);
      }, [resizingProject, localProjects]);

      // Helper to change month
      const prevMonth = () => {
        setCurrentDate(prev => new Date(prev.getFullYear(), prev.getMonth() - 1, 1));
      };
      const nextMonth = () => {
        setCurrentDate(prev => new Date(prev.getFullYear(), prev.getMonth() + 1, 1));
      };

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      // Days in month
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const firstDayIndex = new Date(year, month, 1).getDay();

      // Filter only "In Progress" projects that have startDate and are not archived
      const scheduledProjects = useMemo(() => {
        return localProjects.filter(p => p.startDate && !p.archived && p.status === 'In Progress');
      }, [localProjects]);

      // Color mapper for project timelines
      const getPastelColor = (projId) => {
        const colors = [
          { bg: 'bg-sky-100 border-sky-200 text-sky-800 hover:bg-sky-150' },
          { bg: 'bg-emerald-100 border-emerald-200 text-emerald-800 hover:bg-emerald-150' },
          { bg: 'bg-amber-100 border-amber-200 text-amber-800 hover:bg-amber-150' },
          { bg: 'bg-rose-100 border-rose-200 text-rose-800 hover:bg-rose-150' },
          { bg: 'bg-purple-100 border-purple-200 text-purple-800 hover:bg-purple-150' },
          { bg: 'bg-indigo-100 border-indigo-200 text-indigo-800 hover:bg-indigo-150' },
          { bg: 'bg-orange-100 border-orange-200 text-orange-800 hover:bg-orange-150' }
        ];
        const idStr = String(projId || '');
        const index = Math.abs(idStr.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0)) % colors.length;
        return colors[index];
      };

      const isDateInSpan = (dateStr, start, end) => {
        if (!start) return false;
        const endVal = end || start;
        return dateStr >= start && dateStr <= endVal;
      };

      // Get Today's Date String
      const today = new Date();
      const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

      // Render Calendar Cells
      const cells = [];
      // Empty cells for first week offset
      for (let i = 0; i < firstDayIndex; i++) {
        cells.push(<div key={`empty-${i}`} className="bg-slate-50 border border-gray-150 h-[120px] max-h-[120px]"></div>);
      }

      // Active days
      for (let day = 1; day <= daysInMonth; day++) {
        const dayStr = day < 10 ? `0${day}` : `${day}`;
        const monthStr = (month + 1) < 10 ? `0${month + 1}` : `${month + 1}`;
        const dateStr = `${year}-${monthStr}-${dayStr}`;
        const isToday = dateStr === todayStr;

        // Get projects covering this day
        const dayProjects = scheduledProjects.filter(p => isDateInSpan(dateStr, p.startDate, p.targetEndDate));

        cells.push(
          <div
            key={`day-${day}`}
            onMouseEnter={() => {
              if (resizingProject && dateStr >= resizingProject.startDate) {
                setLocalProjects(prev =>
                  prev.map(p =>
                    p.id === resizingProject.id
                      ? { ...p, targetEndDate: dateStr }
                      : p
                  )
                );
              }
            }}
            onClick={() => {
              setSelectedDateForPopup({ dateStr, dayProjects });
            }}
            className={`border h-[120px] max-h-[120px] p-1.5 flex flex-col justify-between transition-all relative select-none cursor-pointer ${
              isToday
                ? 'border-brandsky bg-sky-50/15 shadow-inner ring-1 ring-brandsky/40'
                : 'border-gray-150 bg-white hover:bg-sky-50/20'
            }`}
          >
            <div className="flex items-center justify-between pb-1">
              <span className={`font-bold text-[11px] ${isToday ? 'text-brandsky bg-sky-100/80 px-1 rounded' : 'text-slate-700'}`}>
                {day} {isToday ? '(Today)' : ''}
              </span>
            </div>

            {/* Scrollable container for cell items */}
            <div className="flex-1 overflow-y-auto max-h-[90px] space-y-1 mt-0.5 scrollbar-thin pr-0.5">
              {dayProjects.map(proj => {
                const isStart = dateStr === proj.startDate;
                const isEnd = dateStr === (proj.targetEndDate || proj.startDate);
                const colors = getPastelColor(proj.id);

                return (
                  <div
                    key={proj.id}
                    onClick={(e) => {
                      e.stopPropagation();
                      onEditProject(proj);
                    }}
                    className={`relative h-6 flex items-center justify-between px-1.5 text-[9.5px] font-bold shadow-xs transition-all border-y border-slate-200/40 cursor-pointer ${colors.bg} ${
                      isStart && isEnd
                        ? 'rounded-md border-x'
                        : isStart
                        ? 'rounded-l-md border-l'
                        : isEnd
                        ? 'rounded-r-md border-r'
                        : 'rounded-none'
                    }`}
                    title={`${proj.title} (${proj.company || 'No Company'})`}
                  >
                    <span className="truncate pr-2 select-none pointer-events-none">
                      {isStart ? proj.title : ''}
                    </span>

                    {isEnd && (
                      <div
                        onMouseDown={(e) => {
                          e.stopPropagation();
                          e.preventDefault();
                          setResizingProject(proj);
                        }}
                        className="absolute right-0 top-0 bottom-0 w-2 hover:bg-black/15 cursor-ew-resize flex items-center justify-center rounded-r-md z-10"
                        title="Drag to change End Date"
                      >
                        <div className="w-[1.5px] h-3 bg-slate-600/60 rounded-full"></div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        );
      }

      // Fill remaining cells for 6-row standard clean grid
      const totalCells = cells.length;
      const remainingCells = 42 - totalCells;
      const actualRemaining = remainingCells >= 7 ? remainingCells - 7 : remainingCells;
      for (let i = 0; i < actualRemaining; i++) {
        cells.push(<div key={`empty-end-${i}`} className="bg-slate-50 border border-gray-150 h-[120px] max-h-[120px]"></div>);
      }

      const monthNames = [
        "January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"
      ];

      return (
        <div
          onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}
          className="fixed inset-0 z-[60] modal-backdrop flex items-center justify-center p-3 sm:p-5 overflow-y-auto"
        >
          <div className="bg-white rounded-xl shadow-2xl w-full max-w-5xl h-[88vh] flex flex-col p-3 space-y-2 border border-gray-200">
            
            {/* Navigation Header */}
            <div className="flex items-center justify-between border-b border-gray-150 pb-2">
              <div className="flex items-center space-x-2">
                <button
                  onClick={prevMonth}
                  className="px-2 py-1 border border-gray-200 rounded bg-white hover:bg-slate-50 font-bold text-slate-700 text-[11px] cursor-pointer"
                >
                  ◀ Prev
                </button>
                <span className="font-bold text-xs text-darkslate min-w-[110px] text-center">
                  {monthNames[month]} {year}
                </span>
                <button
                  onClick={nextMonth}
                  className="px-2 py-1 border border-gray-200 rounded bg-white hover:bg-slate-50 font-bold text-slate-700 text-[11px] cursor-pointer"
                >
                  Next ▶
                </button>
              </div>

              <button
                onClick={onClose}
                className="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-white rounded font-bold text-[11px] cursor-pointer transition-colors"
              >
                Close ✕
              </button>
            </div>

            {/* Day Header Row */}
            <div className="grid grid-cols-7 gap-1 text-center font-bold text-slate-500 border-b border-gray-100 py-1">
              {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => (
                <div key={day} className="text-[10px] uppercase tracking-wider">{day}</div>
              ))}
            </div>

            {/* Calendar Grid Container */}
            <div className="grid grid-cols-7 gap-1 flex-1 overflow-y-auto min-h-0 bg-slate-50 p-1 rounded-lg">
              {cells}
            </div>

            {/* Daily Project Modal Popup */}
            {selectedDateForPopup && (
              <div
                onClick={(e) => { if (e.target === e.currentTarget) setSelectedDateForPopup(null); }}
                className="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4 backdrop-blur-xs"
              >
                <div className="bg-white rounded-xl shadow-2xl max-w-sm w-full p-4 space-y-3 border border-gray-200">
                  <div className="flex items-center justify-between border-b border-gray-100 pb-2">
                    <div className="text-xs font-bold text-darkslate">
                      📅 Projects on {selectedDateForPopup.dateStr}
                    </div>
                    <button
                      onClick={() => setSelectedDateForPopup(null)}
                      className="text-slate-400 hover:text-darkslate text-sm font-bold cursor-pointer"
                    >
                      ✕
                    </button>
                  </div>

                  <div className="space-y-2 max-h-[250px] overflow-y-auto pr-1 scrollbar-thin">
                    {selectedDateForPopup.dayProjects.length === 0 ? (
                      <p className="text-slate-400 text-[11px] italic text-center py-4">No projects scheduled for this day.</p>
                    ) : (
                      selectedDateForPopup.dayProjects.map(proj => {
                        const colors = getPastelColor(proj.id);
                        return (
                          <div
                            key={proj.id}
                            onClick={() => {
                              onEditProject(proj);
                              setSelectedDateForPopup(null);
                            }}
                            className={`p-2 rounded border hover:scale-[1.02] transition-transform cursor-pointer flex flex-col space-y-0.5 ${colors.bg}`}
                          >
                            <span className="font-bold text-[11px] truncate">{proj.title}</span>
                            <div className="flex justify-between items-center text-[9px] opacity-80">
                              <span>{proj.company || 'No Company'}</span>
                              <span>{proj.progress || 0}% Completed</span>
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }
